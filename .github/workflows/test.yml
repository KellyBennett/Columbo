name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  database-boundary:
    name: SQL access boundary
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
      BOUNDARY_REPORT_DIR: ${{ github.workspace }}/.tools/database-boundary-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true
      - name: Install official pinned database guard tools
        run: ./scripts/install-database-tools.sh
      - name: Verify DB imports, API references, exact file manifest and sqlc output
        run: ./scripts/check-database-boundary.sh
      - name: Prove the access guards reject regressions
        if: always()
        run: python3 scripts/database-boundary/test-guards.py
      - name: Retain every boundary diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: columbo-database-boundary-diagnostics
          path: .tools/database-boundary-report
          if-no-files-found: warn

  acceptance:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOOS: linux
      GOARCH: amd64
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/columbo
      - name: Run diagnostic SQLite queries against all seven smells
        shell: bash
        run: |
          root="$PWD"
          status=0
          (cd internal/columbo/testdata/all && "$root/columbo" --staged=false --no-history --output "$RUNNER_TEMP/columbo-fixture.sqlite" ./...) || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          ./scripts/test-sqlite-queries.sh "$RUNNER_TEMP/columbo-fixture.sqlite"
      - name: Test action runner exit status and evidence retention
        run: python3 -m unittest discover -s scripts -p test_run_action.py -v
      - name: Test Checks API projection, batching and failure behavior
        env:
          COLUMBO_TEST_SNAPSHOT: ${{ runner.temp }}/columbo-fixture.sqlite
        run: python3 -m unittest discover -s scripts -p test_github_check.py -v
      - name: Retain query fixture snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: columbo-query-fixture-snapshot
          path: ${{ runner.temp }}/columbo-fixture.sqlite
          if-no-files-found: warn

  columbo:
    name: Columbo self-check
    permissions:
      contents: read
      checks: write
    needs: acceptance
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOOS: linux
      GOARCH: amd64
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Investigate source evidence and publish active-stage findings
        uses: ./
        with:
          artifact-name: columbo-self-check-snapshot

  calibration:
    name: Mutation calibration
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true
          cache-dependency-path: |
            go.sum
            calibration/go.sum
      - name: Harness and operator fixtures
        working-directory: calibration
        run: go test ./...
      - name: Calibrate Columbo's own module
        if: github.event_name == 'push'
        run: |
          go build -o "$RUNNER_TEMP/columbo" ./cmd/columbo
          (cd calibration && go build -o "$RUNNER_TEMP/calibrate" ./cmd/calibrate)
          "$RUNNER_TEMP/calibrate" run --corpus . --module github.com/KellyBennett/Columbo --version "$GITHUB_SHA" \
            --columbo "$RUNNER_TEMP/columbo" --db "$RUNNER_TEMP/calibration.sqlite" --operators all \
            --validity build --max-sites 8 --workers 4
      - name: Report, warning on untriaged survivors
        if: github.event_name == 'push'
        run: |
          "$RUNNER_TEMP/calibrate" report --db "$RUNNER_TEMP/calibration.sqlite" --triage calibration/triage.yaml > "$RUNNER_TEMP/calibration-report.md" 2> "$RUNNER_TEMP/calibration-warnings.txt"
          cat "$RUNNER_TEMP/calibration-report.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$RUNNER_TEMP/calibration-warnings.txt" ]; then echo "::warning::$(cat "$RUNNER_TEMP/calibration-warnings.txt")"; fi
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: columbo-calibration
          path: |
            ${{ runner.temp }}/calibration.sqlite
            ${{ runner.temp }}/calibration-report.md
