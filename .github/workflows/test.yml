name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  database-boundary:
    name: SQL access boundary
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
      BOUNDARY_REPORT_DIR: ${{ github.workspace }}/.tools/database-boundary-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true
      - name: Install official pinned database guard tools
        run: ./scripts/install-database-tools.sh
      - name: Verify DB imports, API references, exact file manifest and sqlc output
        run: ./scripts/check-database-boundary.sh
      - name: Prove the access guards reject regressions
        if: always()
        run: python3 scripts/database-boundary/test-guards.py
      - name: Retain every boundary diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: columbo-database-boundary-diagnostics
          path: .tools/database-boundary-report
          if-no-files-found: warn

  acceptance:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOOS: linux
      GOARCH: amd64
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/columbo
      - name: Run published SQLite queries against all seven smells
        shell: bash
        run: |
          root="$PWD"
          status=0
          (cd internal/columbo/testdata/all && "$root/columbo" --no-history --output "$RUNNER_TEMP/columbo-fixture.sqlite" ./...) || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          ./scripts/test-sqlite-queries.sh "$RUNNER_TEMP/columbo-fixture.sqlite"
      - name: Test Checks API projection, batching and failure behavior
        env:
          COLUMBO_TEST_SNAPSHOT: ${{ runner.temp }}/columbo-fixture.sqlite
        run: python3 -m unittest discover -s scripts -p 'test_*action*.py' -v
      - name: Test publisher
        env:
          COLUMBO_TEST_SNAPSHOT: ${{ runner.temp }}/columbo-fixture.sqlite
        run: python3 -m unittest discover -s scripts -p test_github_check.py -v
      - name: Retain query fixture snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: columbo-query-fixture-snapshot
          path: ${{ runner.temp }}/columbo-fixture.sqlite
          if-no-files-found: warn

  columbo:
    name: Columbo self-check
    permissions:
      contents: read
      checks: write
    needs: acceptance
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOOS: linux
      GOARCH: amd64
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Investigate and publish all findings
        uses: ./
        with:
          artifact-name: columbo-self-check-snapshot
