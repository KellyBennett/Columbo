name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOOS: linux
      GOARCH: amd64
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/columbo

  columbo:
    name: Columbo self-check
    needs: acceptance
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOOS: linux
      GOARCH: amd64
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true
      - name: Build Columbo from this revision
        run: go build -o columbo ./cmd/columbo
      - name: Investigate Columbo, including its tests
        run: ./columbo ./...
