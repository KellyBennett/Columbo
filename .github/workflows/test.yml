name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOOS: linux
      GOARCH: amd64
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/columbo
      - name: Run published SQLite queries against all seven smells
        shell: bash
        run: |
          root="$PWD"
          status=0
          (cd internal/columbo/testdata/all && "$root/columbo" --no-history --output "$RUNNER_TEMP/columbo-fixture.sqlite" ./...) || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          ./scripts/test-sqlite-queries.sh "$RUNNER_TEMP/columbo-fixture.sqlite"
      - name: Retain query fixture snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: columbo-query-fixture-snapshot
          path: ${{ runner.temp }}/columbo-fixture.sqlite
          if-no-files-found: warn

  columbo:
    name: Columbo self-check
    needs: acceptance
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOOS: linux
      GOARCH: amd64
      GOWORK: 'off'
      GOFLAGS: '-buildvcs=false'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true
      - name: Build Columbo from this revision
        run: go build -o columbo ./cmd/columbo
      - name: Investigate Columbo, including its tests
        run: ./columbo ./...
      - name: Retain self-check evidence even when findings fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: columbo-self-check-snapshot
          path: columbo.sqlite
          if-no-files-found: warn
