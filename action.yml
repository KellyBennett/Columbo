name: Columbo
description: Analyze Go code, annotate every finding, and retain the evidence.
inputs:
  working-directory:
    description: Go module directory relative to the checkout.
    default: '.'
  config:
    description: Optional configuration path relative to the Go module directory.
    default: ''
  go-version:
    description: Optional Go version override; otherwise use the checked-out module's go.mod.
    default: ''
  staged:
    description: Enforce only the current ordered refactoring stage; ownership is pending definition.
    default: 'false'
  artifact-name:
    description: Evidence artifact name; use different names for multiple invocations in a job.
    default: columbo-evidence
  token:
    description: GitHub token with checks write permission.
    default: ${{ github.token }}
  name:
    description: Name of the separate check run.
    default: Columbo findings
  head-sha:
    description: Commit to annotate; defaults to the PR head.
    default: ${{ github.event.pull_request.head.sha || github.sha }}
outputs:
  check-url:
    description: URL of the published check.
    value: ${{ steps.publish.outputs.check-url }}
  annotation-count:
    description: Number of annotations successfully published.
    value: ${{ steps.publish.outputs.annotation-count }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.working-directory }}/go.mod
        cache: false
    - name: Build and analyze
      id: analyze
      shell: bash
      env:
        COLUMBO_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        COLUMBO_STAGED: ${{ inputs.staged }}
        COLUMBO_CONFIG: ${{ inputs.config }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-action.sh"
    - name: Publish findings
      id: publish
      if: ${{ !cancelled() && steps.analyze.outputs.exit-code != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        COLUMBO_EVIDENCE: ${{ steps.analyze.outputs.evidence }}
        COLUMBO_EXIT_CODE: ${{ steps.analyze.outputs.exit-code }}
        COLUMBO_CHECK_NAME: ${{ inputs.name }}
        COLUMBO_HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        python3 "$GITHUB_ACTION_PATH/scripts/github-check.py" \
          --snapshot "$COLUMBO_EVIDENCE/report.sqlite" --exit-code "$COLUMBO_EXIT_CODE" \
          --name "$COLUMBO_CHECK_NAME" --head-sha "$COLUMBO_HEAD_SHA" \
          --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --publication-status "$COLUMBO_EVIDENCE/publication.json"
    - name: Retain evidence
      if: ${{ !cancelled() && steps.analyze.outputs.evidence != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.analyze.outputs.evidence }}/
        if-no-files-found: error
    - name: Enforce analysis result
      if: ${{ !cancelled() && steps.analyze.outputs.exit-code != '' }}
      shell: bash
      env:
        COLUMBO_EXIT_CODE: ${{ steps.analyze.outputs.exit-code }}
      run: exit "$COLUMBO_EXIT_CODE"
